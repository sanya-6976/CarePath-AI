[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carepath-backend"
version = "0.1.0"
description = "CarePath AI - Autonomous Healthcare Navigation Platform Backend & Multi-Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CarePath Architect Team", email = "architect@carepath.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "google-generativeai>=0.4.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "chromadb>=0.4.24",
    "redis>=5.0.3",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt,argon2]>=1.7.4",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
    "ruff>=0.3.3"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
